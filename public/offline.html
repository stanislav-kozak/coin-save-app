<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CoinSaveKeeper</title>
    <!-- Served by public/sw.js when there is no network: no external resources at all.
         Colours mirror the design-system tokens in src/app/globals.css. -->
    <style>
      :root {
        --bg: #fdfbf9;
        --card: #ffffff;
        --text: #1c1917;
        --muted: #78716c;
        --border: #e7e1db;
        --primary: #f97350;
        --primary-hover: #e55e3c;
        color-scheme: light;
      }
      :root.dark {
        --bg: #1c1917;
        --card: #292524;
        --text: #f5f1ed;
        --muted: #a8a29e;
        --border: #3f3a35;
        --primary: #fb8a65;
        --primary-hover: #f97350;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 32px 24px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 1px 3px rgba(28, 25, 23, 0.06);
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 32px;
        font-weight: 700;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 22px;
        color: var(--muted);
      }
      .en {
        font-size: 13px;
        line-height: 18px;
      }
      button {
        height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--primary-hover);
      }
    </style>
    <script>
      // The app's saved theme (next-themes), else the system's.
      try {
        var t = localStorage.getItem('theme');
        if (
          t === 'dark' ||
          ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <main>
      <svg width="64" height="64" viewBox="0 0 80 80" aria-hidden="true">
        <circle
          cx="40"
          cy="40"
          r="28"
          fill="none"
          stroke="#F97350"
          stroke-width="13"
          stroke-linecap="round"
          stroke-dasharray="176"
          stroke-dashoffset="44"
          transform="rotate(38 40 40)"
        />
        <circle cx="40" cy="40" r="10" fill="#F59E0B" />
      </svg>
      <h1>Немає зв'язку</h1>
      <p>Перевірте інтернет — і спробуйте ще раз. Ваші дані в безпеці на сервері.</p>
      <p class="en" lang="en">You're offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Спробувати ще · Try again</button>
    </main>
  </body>
</html>
