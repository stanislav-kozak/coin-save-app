name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/stanislav-kozak/coin-save-app

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npx prettier --check .
      - run: npm run typecheck # also generates the API client (pretypecheck)
      - run: npm run test
      - run: npm run build

  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs the backend repo's deploy script for the `web` service on the shared VPS.
  # Off until the backend's compose/Caddy know the `web` service: set the repository
  # variable WEB_DEPLOY_ENABLED=true to turn it on.
  deploy:
    needs: docker
    if: >-
      always() && vars.WEB_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (needs.docker.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.docker.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-web
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.event_name == 'push' && github.sha || 'main' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,VPS_APP_DIR
          script: |
            set -e
            cd "$VPS_APP_DIR"
            git pull --ff-only origin main
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            set +e
            ./deploy.sh web "$IMAGE_TAG"; rc=$?
            docker logout ghcr.io
            exit $rc
